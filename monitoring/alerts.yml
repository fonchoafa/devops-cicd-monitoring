# Alert rules. Prometheus evaluates them and shows firing alerts at http://localhost:9090/alerts.
# (Sending e-mail or chat messages needs Alertmanager, which this project does not run.)
groups:
  - name: cloud-notes
    rules:
      - alert: AppDown
        expr: up{job="cloud-notes"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Cloud Notes is down
          description: Prometheus could not scrape the app for 30 seconds.

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of requests fail
          description: The share of 5xx responses has been above 5% for a minute.

      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m]))) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 95% of requests are slower than 0.5 s
          description: The 95th percentile latency has been above 0.5 seconds for two minutes.
