# Prometheus pulls ("scrapes") /metrics from the app every few seconds and stores the numbers.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cloud-notes
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]   # "app" is the Compose service name on the private network
        labels:
          service: cloud-notes
